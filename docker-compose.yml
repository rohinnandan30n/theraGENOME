version: '3.8'

services:
  # ============================================================================
  # PostgreSQL - Kong Persistent Storage
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: theragenome-postgres
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kongpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - theragenome
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Kong Migrations - Initialize database schema
  # ============================================================================
  kong-migrations:
    image: kong:3.3-alpine
    container_name: theragenome-kong-migrations
    command: kong migrations bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
    networks:
      - theragenome

  # ============================================================================
  # Kong API Gateway
  # ============================================================================
  kong:
    image: kong:3.3-alpine
    container_name: theragenome-kong
    depends_on:
      - postgres
      - kong-migrations
      - redis
    environment:
      # Core Configuration
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
      KONG_ADMIN_LISTEN: 0.0.0.0:8001 ssl
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      
      # Plugins
      KONG_PLUGINS: bundled,jwt,rate-limiting,tcp-log,cors,request-transformer,opentelemetry
      
      # OpenTelemetry Configuration
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      KONG_TRACING: on
      KONG_TRACING_INSTRUMENTATIONS: all
      
      # Security
      KONG_ADMIN_SSL_CERT: /etc/kong/ssl/kong.crt
      KONG_ADMIN_SSL_KEY: /etc/kong/ssl/kong.key
      KONG_PROXY_SSL_CERT: /etc/kong/ssl/kong.crt
      KONG_PROXY_SSL_KEY: /etc/kong/ssl/kong.key
      
      # Logging
      KONG_DEBUG: "on"
      KONG_LOG_LEVEL: info
    
    volumes:
      - ./ssl:/etc/kong/ssl
      - ./kong.yml:/etc/kong/kong.yml:ro
    
    ports:
      - "8000:8000"      # Proxy HTTP
      - "8443:8443"      # Proxy HTTPS
      - "8001:8001"      # Admin API HTTP (SSL)
      - "8444:8444"      # Admin API HTTPS
    
    networks:
      - theragenome
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Kong Manager - Web UI for Kong Admin API
  # ============================================================================
  kong-manager:
    image: kong:3.3-alpine
    container_name: theragenome-kong-manager
    depends_on:
      - kong
    environment:
      KONG_ROLE: control_plane
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
    ports:
      - "8002:8002"  # Manager UI
    networks:
      - theragenome

  # ============================================================================
  # Redis - For rate limiting and caching
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: theragenome-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - theragenome
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # OpenTelemetry Collector - Collects traces
  # ============================================================================
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: theragenome-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9411:9411"   # Zipkin
    networks:
      - theragenome
    depends_on:
      - jaeger

  # ============================================================================
  # Jaeger - Distributed tracing and visualization
  # ============================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: theragenome-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"  # Jaeger UI
      - "14268:14268"
      - "14250:14250"
    networks:
      - theragenome

  # ============================================================================
  # Prometheus - Metrics collection (for Kong metrics)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: theragenome-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - theragenome

  # ============================================================================
  # Grafana - Metrics visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: theragenome-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - theragenome

  # ============================================================================
  # Logstash - Log collection and processing (optional)
  # ============================================================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.5.0
    container_name: theragenome-logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      - indices.memory.index_buffer_size=256m
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    networks:
      - theragenome
    depends_on:
      - elasticsearch

  # ============================================================================
  # Elasticsearch - Log storage and search
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    container_name: theragenome-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - theragenome

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:

  # ============================================================================
  # TheraGenome FastAPI - Python Backend Services
  # ============================================================================
  theragenome-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: theragenome-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: thergenome_dev
      DB_USER: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    networks:
      - theragenome
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # Variant Results API - Deno/TypeScript Service
  # ============================================================================
  variant-results-api:
    build:
      context: .
      dockerfile: Dockerfile.deno
    container_name: theragenome-variant-results
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: thergenome_dev
      DB_USER: postgres
      DB_PASSWORD: password
      PORT: 8001
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./theraGENOME/src:/app/src
    networks:
      - theragenome
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # Kafka - Message Queue for Event Streaming
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: theragenome-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    networks:
      - theragenome
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Zookeeper - Kafka Coordination
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: theragenome-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    ports:
      - "2181:2181"
    networks:
      - theragenome

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  zookeeper-data:

networks:
  theragenome:
    driver: bridge
