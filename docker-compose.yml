version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: theragenome-postgres
    environment:
      POSTGRES_DB: theragenome
      POSTGRES_USER: theragenome
      POSTGRES_PASSWORD: theragenome
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theragenome -d theragenome"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - theragenome-network

  redis:
    image: redis:7-alpine
    container_name: theragenome-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - theragenome-network

volumes:
  postgres_data:
    driver: local

networks:
  theragenome-network:
    driver: bridge
