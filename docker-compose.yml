version: '3.8'

services:
  # ============================================================================
  # PostgreSQL - Kong Persistent Storage
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: theragenome-postgres
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kongpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - theragenome
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Kong Migrations - Initialize database schema
  # ============================================================================
  kong-migrations:
    image: kong:3.3-alpine
    container_name: theragenome-kong-migrations
    command: kong migrations bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
    networks:
      - theragenome

  # ============================================================================
  # Kong API Gateway
  # ============================================================================
  kong:
    image: kong:3.3-alpine
    container_name: theragenome-kong
    depends_on:
      - postgres
      - kong-migrations
      - redis
    environment:
      # Core Configuration
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
      KONG_ADMIN_LISTEN: 0.0.0.0:8001 ssl
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      
      # Plugins
      KONG_PLUGINS: bundled,jwt,rate-limiting,tcp-log,cors,request-transformer,opentelemetry
      
      # OpenTelemetry Configuration
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      KONG_TRACING: on
      KONG_TRACING_INSTRUMENTATIONS: all
      
      # Security
      KONG_ADMIN_SSL_CERT: /etc/kong/ssl/kong.crt
      KONG_ADMIN_SSL_KEY: /etc/kong/ssl/kong.key
      KONG_PROXY_SSL_CERT: /etc/kong/ssl/kong.crt
      KONG_PROXY_SSL_KEY: /etc/kong/ssl/kong.key
      
      # Logging
      KONG_DEBUG: "on"
      KONG_LOG_LEVEL: info
    
    volumes:
      - ./ssl:/etc/kong/ssl
      - ./kong.yml:/etc/kong/kong.yml:ro
    
    ports:
      - "8000:8000"      # Proxy HTTP
      - "8443:8443"      # Proxy HTTPS
      - "8001:8001"      # Admin API HTTP (SSL)
      - "8444:8444"      # Admin API HTTPS
    
    networks:
      - theragenome
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Kong Manager - Web UI for Kong Admin API
  # ============================================================================
  kong-manager:
    image: kong:3.3-alpine
    container_name: theragenome-kong-manager
    depends_on:
      - kong
    environment:
      KONG_ROLE: control_plane
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
    ports:
      - "8002:8002"  # Manager UI
    networks:
      - theragenome

  # ============================================================================
  # Redis - For rate limiting and caching
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: theragenome-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - theragenome
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # OpenTelemetry Collector - Collects traces
  # ============================================================================
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: theragenome-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9411:9411"   # Zipkin
    networks:
      - theragenome
    depends_on:
      - jaeger

  # ============================================================================
  # Jaeger - Distributed tracing and visualization
  # ============================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: theragenome-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"  # Jaeger UI
      - "14268:14268"
      - "14250:14250"
    networks:
      - theragenome

  # ============================================================================
  # Prometheus - Metrics collection (for Kong metrics)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: theragenome-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - theragenome

  # ============================================================================
  # Grafana - Metrics visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: theragenome-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - theragenome

  # ============================================================================
  # Logstash - Log collection and processing (optional)
  # ============================================================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.5.0
    container_name: theragenome-logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      - indices.memory.index_buffer_size=256m
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    networks:
      - theragenome
    depends_on:
      - elasticsearch

  # ============================================================================
  # Elasticsearch - Log storage and search
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    container_name: theragenome-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - theragenome

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:

networks:
  theragenome:
    driver: bridge
