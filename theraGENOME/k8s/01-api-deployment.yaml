apiVersion: apps/v1
kind: Deployment
metadata:
  name: theragenome-api
  namespace: theragenome
  labels:
    app: theragenome-api
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: theragenome-api
  template:
    metadata:
      labels:
        app: theragenome-api
        version: v1
    spec:
      serviceAccountName: theragenome-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: api
        image: theragenome/api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: theragenome-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: theragenome-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: theragenome-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: theragenome-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: theragenome-secrets
              key: DB_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: theragenome-config
              key: REDIS_HOST
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: theragenome-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: theragenome-config
              key: ENVIRONMENT
        
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: tmp
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - theragenome-api
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: theragenome-api
  namespace: theragenome
  labels:
    app: theragenome-api
spec:
  type: ClusterIP
  selector:
    app: theragenome-api
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: theragenome-api
  namespace: theragenome
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: theragenome-api-pdb
  namespace: theragenome
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: theragenome-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: theragenome-api-hpa
  namespace: theragenome
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: theragenome-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
