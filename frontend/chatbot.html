<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheraGenome AI - Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #14b8a6;
            --primary-dark: #0d9488;
            --secondary: #a855f7;
            --accent: #f97316;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #eab308;
            --bg-dark: #0f1419;
            --bg-card: #1a2332;
            --bg-hover: #2d3e52;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #374151;
            --border-light: rgba(148, 163, 184, 0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a2f4a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: rgba(26, 35, 50, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            padding: 20px 30px;
            border-radius: 12px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-tag {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: 8px;
            -webkit-text-fill-color: var(--text-secondary);
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .back-btn {
            padding: 10px 20px;
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3);
        }

        .logout-btn {
            padding: 10px 20px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .chatbot-main {
            background: rgba(26, 35, 50, 0.6);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(20px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 250px);
        }

        .chatbot-header {
            background: linear-gradient(135deg, var(--primary) 0%, #0d9488 100%);
            color: var(--bg-dark);
            padding: 20px 30px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .chatbot-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .chatbot-header p {
            font-size: 14px;
            opacity: 0.9;
            color: rgba(15, 20, 25, 0.8);
        }

        .chatbot-mode-selector {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .mode-btn-group label {
            font-size: 12px;
            color: rgba(15, 20, 25, 0.7);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .mode-btn-group input[type="radio"] {
            cursor: pointer;
        }

        .chatbot-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chatHistory {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: rgba(15, 20, 25, 0.5);
        }

        .chat-welcome {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 20px;
        }

        .chat-welcome h2 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: 700;
        }

        .chat-welcome p {
            font-size: 14px;
            line-height: 1.6;
        }

        .chat-message {
            margin-bottom: 20px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-message.user-message {
            justify-content: flex-end;
        }

        .chat-message.bot-message {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 15px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .user-message .message-content {
            background: var(--primary);
            color: var(--bg-dark);
            border-radius: 12px 0 12px 12px;
            font-weight: 500;
        }

        .bot-message .message-content {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 0 12px 12px 12px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 5px;
        }

        .message-time {
            font-size: 12px;
            opacity: 0.7;
        }

        .chatbot-input-area {
            padding: 20px 30px;
            background: rgba(26, 35, 50, 0.9);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        #chatInput {
            flex: 1;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: var(--bg-card);
            color: var(--text-primary);
            resize: none;
            min-height: 50px;
            max-height: 100px;
        }

        #chatInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
        }

        #chatInput::placeholder {
            color: var(--text-secondary);
        }

        #sendButton {
            padding: 15px 25px;
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        #sendButton:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3);
        }

        #sendButton:active {
            transform: translateY(0);
        }

        #sendButton.loading {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Scrollbar styling */
        #chatHistory::-webkit-scrollbar {
            width: 8px;
        }

        #chatHistory::-webkit-scrollbar-track {
            background: rgba(15, 20, 25, 0.5);
        }

        #chatHistory::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        #chatHistory::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        @media (max-width: 768px) {
            .chatbot-main {
                height: calc(100vh - 200px);
            }

            .message-content {
                max-width: 85%;
            }

            #chatHistory {
                padding: 20px;
            }

            .chatbot-input-area {
                padding: 15px 20px;
                flex-wrap: wrap;
            }

            #chatInput {
                min-height: 45px;
            }

            #sendButton {
                padding: 12px 20px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">theraGENOME<span class="logo-tag">| Precision Medicine</span></div>
            <div class="nav-links">
                <a href="reports.html" class="back-btn">← Back to Reports</a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="chatbot-main">
            <div class="chatbot-header">
                <h1>🤖 TheraGenome AI Assistant</h1>
                <p>Your personalized genomic and medical information helper</p>
                <div class="chatbot-mode-selector">
                    <div class="mode-btn-group">
                        <label>
                            <input type="radio" id="doctorMode" name="chatbotMode" value="doctor" checked>
                            <span>Doctor Mode</span>
                        </label>
                    </div>
                    <div class="mode-btn-group">
                        <label>
                            <input type="radio" id="patientMode" name="chatbotMode" value="patient">
                            <span>Patient Mode</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="chatbot-content">
                <div id="chatHistory">
                    <div class="chat-welcome">
                        <h2>👋 Welcome to TheraGenome AI</h2>
                        <p>Ask me anything about genomics, medical conditions, genes, drug interactions, or your health reports. I'm here to help!</p>
                    </div>
                </div>

                <div class="chatbot-input-area">
                    <select id="chatbotModeSelect" class="mode-selector" style="padding: 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; display: none;">
                        <option value="doctor">Doctor Mode</option>
                        <option value="patient">Patient Mode</option>
                    </select>
                    <textarea id="chatInput" placeholder="Ask me anything... (Press Enter or click Send)" rows="1"></textarea>
                    <button id="sendButton">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load JavaScript files -->
    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/voice-service.js"></script>
    <script src="assets/js/ui-renderer.js"></script>
    <script src="assets/js/chatbot-controller.js"></script>

    <script>
        // Handle radio button change to update the hidden select
        document.querySelectorAll('input[name="chatbotMode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.getElementById('chatbotModeSelect').value = e.target.value;
                localStorage.setItem('chatbotMode', e.target.value);
            });
        });

        // Restore saved mode
        const savedMode = localStorage.getItem('chatbotMode') || 'doctor';
        document.getElementById(savedMode + 'Mode').checked = true;

        // Initialize chatbot on page load
        let chatbot;
        document.addEventListener('DOMContentLoaded', () => {
            chatbot = new ChatbotController();
        });

        // Handle logout
        function logout() {
            fetch('/api/v1/auth/logout', { method: 'POST' })
                .then(() => {
                    localStorage.removeItem('userEmail');
                    localStorage.removeItem('userRole');
                    window.location.href = 'index.html';
                })
                .catch(err => console.error('Logout error:', err));
        }
    </script>
</body>
</html>
