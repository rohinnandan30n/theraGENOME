#       client_id: theragenome-web-app
#       client_secret: your-client-secret
#       redirect_uris:
#         - http://localhost:3000/callback

# ============================================================================
# JWT VALIDATION ENDPOINTS (Shared JWKS Endpoint)
# ============================================================================
# Configure your JWKS provider URL in Kong config:
# 
# To use this configuration:
# 1. Generate RSA keypair: openssl genrsa -out private_key.pem 2048
# 2. Extract public key: openssl rsa -in private_key.pem -pubout -out public_key.pem
# 3. Convert to JWKS format and host at: https://auth.theragenome.com/.well-known/jwks.json
# 4. Configure JWT plugin to reference this URL
#
# Example JWT payload:
# {
#   "sub": "clinician-001",
#   "iss": "https://auth.theragenome.com",
#   "aud": "https://api.theragenome.com",
#   "scope": "variants pathogens drugs",
#   "iat": 1609459200,
#   "exp": 1609545600
# }

# ============================================================================
# RATE LIMITING CONFIGURATION
# ============================================================================
# Current settings: 100 requests per minute per consumer (clinician)
# 
# To adjust:
# - minute: 100          # requests per minute
# - hour: 6000           # requests per hour (optional)
# - policy: redis        # use Redis for distributed rate limiting
# - limit_by: consumer   # limit by authenticated consumer
# 
# Redis setup required:
# docker run -d -p 6379:6379 redis:7
