global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'theragenome'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Kong API Gateway metrics
  - job_name: 'kong'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['kong:8001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'kong-gateway'

  # Redis metrics (if redis_exporter is deployed)
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']

  # Node exporter (host metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  # Opentelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  # Application metrics (Dev services)
  - job_name: 'dev-applications'
    static_configs:
      - targets:
          - 'localhost:8000'  # Dev 1
          - 'localhost:8001'  # Dev 2
          - 'localhost:8002'  # Dev 3
        labels:
          service: 'microservices'
