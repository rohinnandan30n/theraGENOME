# ============================================================================
# Redis Configuration - TheraGenome Secure Instance
# ============================================================================
# 
# This configuration file sets up Redis with security hardening:
# - Requirepass authentication
# - No external access (localhost binding)
# - Memory limits with LRU eviction
# - Disabled dangerous commands
# - AOF persistence for safety
#

# ============================================================================
# Authentication
# ============================================================================

# Require password for all connections
# Value read from environment variable REDIS_PASSWORD
requirepass ${REDIS_PASSWORD}


# ============================================================================
# Network & Connection
# ============================================================================

# CRITICAL: Bind only to localhost (no external access)
bind 127.0.0.1

# Protect server from external access if bind fails
protected-mode yes

# Default port
port 6379

# TCP backlog
tcp-backlog 511

# Timeout for idle clients (0 = no timeout, but we'll set idle in service)
timeout 0

# TCP keepalive
tcp-keepalive 300


# ============================================================================
# Memory Management
# ============================================================================

# Maximum memory Redis can use (512MB for TheraGenome caching)
maxmemory 512mb

# Memory eviction policy: LRU (Least Recently Used)
# When maxmemory is reached, evict oldest unused keys
# Options: 
#   - volatile-lru: Evict LRU keys with TTL
#   - allkeys-lru: Evict LRU keys from all datasets
#   - volatile-lfu: Evict LFU keys with TTL
#   - allkeys-lfu: Evict LFU keys from all datasets
#   - volatile-random: Random evict keys with TTL
#   - allkeys-random: Random evict keys from all datasets
#   - volatile-ttl: Evict keys with TTL (nearest expiry first)
#   - noeviction: No eviction, return error on memory full
maxmemory-policy allkeys-lru

# Number of samples to check for eviction
maxmemory-samples 5


# ============================================================================
# Persistence (AOF - Append Only File)
# ============================================================================

# Enable AOF persistence for durability
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# AOF fsync policy
# Options: always (sync every write), everysec, no
appendfsync everysec

# Prevent fsync during rewrites
no-appendfsync-on-rewrite no

# Trigger rewrite when AOF is 100% of previous size and >= 64mb
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 67108864

# Prevent rewrite during other operations
aof-rewrite-incremental-fsync yes


# ============================================================================
# Security - Disable Dangerous Commands
# ============================================================================

# FLUSHALL: Wipes entire database
# CRITICAL: Disable to prevent accidental data loss
rename-command FLUSHALL ""

# FLUSHDB: Wipes current database
# CRITICAL: Disable to prevent accidental data loss
rename-command FLUSHDB ""

# DEBUG: Allows arbitrary memory inspection
# CRITICAL: Disable to prevent security vulnerabilities
rename-command DEBUG ""

# CONFIG: Allow configuration changes
# CRITICAL: Rename to prevent unauthorized configuration
rename-command CONFIG CONFIG_THERAGENOME_ONLY

# SHUTDOWN: Allow graceful shutdown (rename for access control)
# KEPT accessible but with warning in logs
# rename-command SHUTDOWN SHUTDOWN_THERAGENOME_ONLY


# ============================================================================
# Logging
# ============================================================================

# Log level: debug, verbose, notice, warning
loglevel notice

# Log file location (empty = stdout)
logfile ""

# Syslog output disabled
syslog-enabled no

# Syslog facility
syslog-facility local0


# ============================================================================
# Performance Tuning
# ============================================================================

# Database count (we use db 0)
databases 1

# Lazyfree defaults
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Active defragmentation (memory fragmentation optimization)
activedefrag no
# active-defrag-ignore-bytes 100mb
# active-defrag-threshold-lower 10
# active-defrag-threshold-upper 100


# ============================================================================
# REPLICATION (Not used in single instance, but set for safety)
# ============================================================================

# No replication configured
# If replication is added later:
# replicaof <masterip> <masterport>

# Replica serves stale data when master connection lost
replica-serve-stale-data yes

# Replica is read-only
replica-read-only yes


# ============================================================================
# CLUSTER (Not used in TheraGenome)
# ============================================================================

# Cluster disabled (using single instance)
cluster-enabled no


# ============================================================================
# Monitoring & Health
# ============================================================================

# Slowlog for monitoring slow queries
slowlog-log-slower-than 10000  # microseconds
slowlog-max-len 128

# Command latency monitoring
# latency-monitor-threshold 0


# ============================================================================
# CLIENT MANAGEMENT (for future implementation)
# ============================================================================

# Maximum connected clients
# maxclients 10000

# Client output buffer limits (prevent memory runaway)
# client-output-buffer-limit normal 0 0 0
# client-output-buffer-limit replica 256mb 64mb 60
# client-output-buffer-limit pubsub 32mb 8mb 60


# ============================================================================
# MISCELLANEOUS
# ============================================================================

# Disable RESP3 (use RESP2 for compatibility)
proto-max-bulk-len 537000000

# Enable ACL (Access Control Lists) for future role-based access
# aclfile /etc/redis/users.acl

# Min replicas for write (N replicas must acknowledge write)
# min-replicas-to-write 0
# min-replicas-max-lag 10

# Stop accepting writes if less than min-replicas acknowledge (>= N seconds)
# min-replicas-to-write 0

# Async replication
repl-diskless-sync no
repl-diskless-fsync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no

# Backlog size for replication (64MB)
repl-backlog-size 67108864
repl-backlog-ttl 3600

# Role detection
role-based-auth-enabled no

# ==========================================================================
# END OF CONFIGURATION
# ==========================================================================
# 
# NOTE: Environment variable REDIS_PASSWORD must be set before starting
# to enable authentication. See docker-compose.yml for how this is passed.
#
# Security best practices applied:
# ✓ Authentication required (requirepass)
# ✓ Localhost-only binding (bind 127.0.0.1)
# ✓ Dangerous commands disabled (FLUSHALL, FLUSHDB, DEBUG)
# ✓ CONFIG command renamed to prevent unauthorized changes
# ✓ Memory limits enforce (maxmemory, maxmemory-policy)
# ✓ AOF persistence enabled for durability
# ✓ No keys without TTL (enforced at application layer)
# ✓ No PII in cache (enforced at application layer)
#
