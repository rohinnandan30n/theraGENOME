input {
  # TCP input for Kong logs (from tcp-log plugin)
  tcp {
    port => 5000
    codec => json
    type => "kong_log"
  }
  
  # UDP input as fallback
  udp {
    port => 5000
    codec => json
    type => "kong_log"
  }
}

filter {
  # Parse Kong logs
  if [type] == "kong_log" {
    # Extract timestamp
    date {
      match => ["timestamp", "UNIX_MS"]
      target => "@timestamp"
    }
    
    # Enrich with metadata
    mutate {
      add_field => {
        "kubernetes.cluster.name" => "theragenome"
        "kubernetes.deployment" => "kong-api-gateway"
        "environment" => "production"
      }
      
      # Convert numeric fields
      convert => {
        "body_bytes_sent" => "integer"
        "bytes_sent" => "integer"
        "response_time" => "float"
        "upstream_response_time" => "float"
      }
    }
    
    # Grok pattern for Kong access logs
    if ![type] {
      grok {
        match => {
          "message" => "%{IP:clientip} %{USER:ident} %{USER:auth} \[%{HTTPDATE:timestamp}\] \"%{WORD:verb} %{DATA:request} HTTP/%{NUMBER:httpversion}\" %{NUMBER:response} %{NUMBER:bytes} %{QS:referrer} %{QS:agent}"
        }
        overwrite => ["message"]
      }
    }
    
    # Tag for different services
    if [service_name] =~ /dev1/ {
      mutate {
        add_tag => ["dev1", "variants", "classification"]
      }
    } else if [service_name] =~ /dev2/ {
      mutate {
        add_tag => ["dev2", "pathogens", "resistance"]
      }
    } else if [service_name] =~ /dev3/ {
      mutate {
        add_tag => ["dev3", "drugs", "safety", "toxicity"]
      }
    }
    
    # Log level classification
    if [response] >= 500 {
      mutate {
        add_tag => ["error", "alert"]
      }
    } else if [response] >= 400 {
      mutate {
        add_tag => ["client_error", "warning"]
      }
    } else if [response] >= 300 {
      mutate {
        add_tag => ["redirect", "info"]
      }
    } else {
      mutate {
        add_tag => ["success", "info"]
      }
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "kong-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  
  # Console output for debugging
  if [@metadata][debug] {
    stdout {
      codec => rubydebug
    }
  }
}
