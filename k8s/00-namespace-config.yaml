apiVersion: v1
kind: Namespace
metadata:
  name: theragenome
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: theragenome-config
  namespace: theragenome
data:
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "thergenome_dev"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-broker:9092"
  ENVIRONMENT: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: theragenome-secrets
  namespace: theragenome
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "changeme-in-production"
  JWT_SECRET_KEY: "your-secret-key-change-in-production"
  ADMIN_API_KEY: "admin-key-change-in-production"
