# Alembic Configuration - TheraGenome Database Migrations
# This file is auto-generated by Alembic

[alembic]
# path to migration scripts
script_location = alembic

# template to use to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# as a list of path segments in colon or semicolon-separated format, what is
# important is that the first path segment (if it exists) must not be quoted, as
# it is inserted into the script. If you use this syntax, the directory is added
# to the sys.path and the `alembic` module is imported from the current directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to os.environ so that it can be used in your migration files
# without additional configuration
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field in %%(slug)s
# set to 0 to disable completely
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%(asctime)s
